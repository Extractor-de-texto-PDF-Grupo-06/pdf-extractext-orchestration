[project]
name = "pdf-extractext-orchestration-tests"
version = "0.1.0"
description = "Pruebas extremo a extremo de pdf-extractext por Traefik"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pyyaml>=6.0.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
markers = [
    "e2e: pruebas extremo a extremo contra el stack levantado",
]
testpaths = ["e2e"]
